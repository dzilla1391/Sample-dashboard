<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NED Dashboard Pro</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header class="header">
    NED Dashboard Pro
</header>

<!-- DASHBOARD -->
<div id="dashboard" class="screen active">

    <div class="section">

        <div class="card">
            <input
                id="searchBox"
                placeholder="Search..."
                onkeyup="searchTables()">
        </div>

        <div class="kpi-grid">

            <div class="card">
                <div class="kpi">78%</div>
                <p>Progress</p>
            </div>

            <div class="card">
                <div class="kpi">0.96</div>
                <p>SPI</p>
            </div>

            <div class="card">
                <div class="kpi">23</div>
                <p>Issues</p>
            </div>

            <div class="card">
                <div class="kpi">14/17</div>
                <p>Milestones</p>
            </div>

        </div>

        <div class="card">
            <h3>Overall Progress</h3>
            <canvas id="overallChart"></canvas>
        </div>

        <div class="card">
            <h3>Discipline Progress</h3>
            <canvas id="disciplineChart"></canvas>
        </div>

    </div>
</div>
